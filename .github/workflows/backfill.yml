name: Backfill CONECT Productivity Reports

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: true
        default: '2026-06-01'
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: true
        default: '2026-09-05'

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backfill script
        env:
          CONECT_USER: ${{ secrets.CONECT_USER }}
          CONECT_PASSWORD: ${{ secrets.CONECT_PASSWORD }}
        run: |
          python conect_automation_backfill.py \
            --start-date "${{ github.event.inputs.start_date }}" \
            --end-date "${{ github.event.inputs.end_date }}"

      - name: Upload reports as artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-reports
          path: 'reports/*.csv'
          retention-days: 30
