name: Backfill
on:
  workflow_dispatch:
      inputs:
            data_inicio:
                    required: false
                            default: '2026-06-01'
                                  data_fim:
                                          required: false
                                                  default: '2026-09-05'
                                                  jobs:
                                                    backfill:
                                                        runs-on: ubuntu-latest
                                                            steps:
                                                                  - uses: actions/checkout@v4
                                                                        - uses: actions/setup-python@v4
                                                                                with:
                                                                                          python-version: '3.13'
                                                                                                - run: pip install -r requirements.txt
                                                                                                      - run: python conect_automation_backfill.py
                                                                                                              env:
                                                                                                                        CONECT_USER: ${{ secrets.CONECT_USER }}
                                                                                                                                  CONECT_PASS: ${{ secrets.CONECT_PASS }}
                                                                                                                                            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
