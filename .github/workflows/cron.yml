name: Daily CONECT Automation

on:
  schedule:
    - cron: '0 7 * * *'  # 7h todo dia (horário UTC)

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway Deploy
        run: |
          curl -X POST https://railway.app/api/deployments \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"service":"worker"}'
